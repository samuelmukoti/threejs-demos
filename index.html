<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>three-demos</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; width: 100%; height: 100%; }
      #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 0.6s ease; }
      #hud { position: fixed; inset: 0; pointer-events: none; font-family: system-ui, sans-serif; color: #fff; }
      #no-webgl { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; background: #111; color: #eee; font-family: system-ui, sans-serif; text-align: center; padding: 2rem; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="fade"></div>
    <div id="hud"></div>
    <div id="no-webgl">WebGL is not available in this browser, so the demos cannot run.</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
